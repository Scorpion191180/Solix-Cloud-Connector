services:
  - type: web
    name: solix-cloud-connector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUDI_REFRESH_TOKEN
        sync: false
      - key: AUDI_COUNTRY
        value: DE
      - key: AUDI_API_LEVEL
        value: "1"
      - key: AUDI_CACHE_SECONDS
        value: "900"
      - key: AUDI_HOME_LATITUDE
        sync: false
      - key: AUDI_HOME_LONGITUDE
        sync: false
      - key: HOUSE_LOCATION_LABEL
        sync: false
      - key: WASTE_ICS_URL
        sync: false
      - key: WASTE_CACHE_SECONDS
        value: "21600"
      - key: AUDI_HOME_RADIUS_METERS
        value: "120"
      - key: AUDI_POSITION_INTERVAL_SECONDS
        value: "120"
      - key: SOLIX_CACHE_SECONDS
        value: "30"
      - key: SOLIX_TELEMETRY_INTERVAL_SECONDS
        value: "60"
      - key: SOLIX_SOLARBANK_PN
        value: "AE103"
      - key: SOLIX_BATTERY_CAPACITY_WH
        value: "10400"
      - key: SOLAR_EXPORT_AUTOMATION_ENABLED
        value: "true"
      - key: SOLAR_EXPORT_AUTOMATION_DRY_RUN
        value: "true"
      - key: SOLAR_EXPORT_START_SOC
        value: "98"
      - key: SOLAR_EXPORT_STOP_SOC
        value: "95"
      - key: SOLAR_EXPORT_POWER_W
        value: "450"
      - key: SOLAR_EXPORT_START_PV_W
        value: "450"
      - key: SOLAR_EXPORT_STOP_PV_W
        value: "250"
      - key: SOLAR_EXPORT_INTERVAL_SECONDS
        value: "60"
      - key: SOLAR_EXPORT_ERROR_RETRY_SECONDS
        value: "900"
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: AUTOMATION_DRY_RUN
        value: "true"
      - key: AUTOMATION_ON_SOC
        value: "30"
      - key: AUTOMATION_OFF_SOC
        value: "10"
      - key: AUTOMATION_INTERVAL_SECONDS
        value: "60"
      - key: SMARTPLUG_MANUAL_CONTROL
        value: "false"
      - key: SMARTPLUG_CONTROL_TOKEN
        sync: false
      - key: GARAGE_CONTROL_ENABLED
        value: "false"
      - key: GARAGE_CONTROL_TOKEN
        sync: false
      - key: TUYA_API_ENDPOINT
        value: https://openapi.tuyaeu.com
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_SECRET
        sync: false
      - key: TUYA_GARAGE_MIDDLE_DEVICE_ID
        sync: false
      - key: TUYA_GARAGE_MIDDLE_COMMAND_CODE
        sync: false
      - key: TUYA_GARAGE_MIDDLE_STATUS_CODE
        sync: false
      - key: TUYA_GARAGE_MIDDLE_OPEN_VALUE
        sync: false
      - key: TUYA_GARAGE_MIDDLE_CLOSE_VALUE
        sync: false
