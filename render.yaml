services:
  - type: web
    name: solix-cloud-connector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUDI_REFRESH_TOKEN
        sync: false
      - key: AUDI_COUNTRY
        value: DE
      - key: AUDI_API_LEVEL
        value: "1"
      - key: AUDI_CACHE_SECONDS
        value: "900"
      - key: SOLIX_CACHE_SECONDS
        value: "30"
      - key: SOLIX_SOLARBANK_PN
        value: "AE103"
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: AUTOMATION_DRY_RUN
        value: "true"
      - key: AUTOMATION_ON_SOC
        value: "30"
      - key: AUTOMATION_OFF_SOC
        value: "10"
      - key: AUTOMATION_INTERVAL_SECONDS
        value: "900"
